name: Build AAR source

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android platform 34
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKM" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "installed:"
          ls "$ANDROID_SDK_ROOT/platforms" "$ANDROID_SDK_ROOT/build-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build library AAR
        run: gradle --no-daemon --console=plain :library:assembleRelease --stacktrace
        working-directory: source
        continue-on-error: true

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mundolvl10-library-release
          path: source/library/build/outputs/aar/*.aar

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: source/library/build/reports/